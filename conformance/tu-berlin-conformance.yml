generated: '2026-08-30'
method: probed
source: >-
  Live unauthenticated probes of TU Berlin operated hosts on 2026-08-30 —
  api-depositonce.tu-berlin.de, shibboleth.tu-berlin.de, isis.tu-berlin.de,
  git.tu-berlin.de, matrix.tu-berlin.de — plus the DataCite public API for the
  DOI prefix DepositOnce mints under.
docs: https://www.tu.berlin/campusmanagement
note: >-
  TU Berlin publishes no OpenAPI, AsyncAPI or apis.json of its own, so nothing here is
  derived from a contract the institution authored. Every entry below is read from a live
  response on a host under a TU Berlin registrable domain (tu.berlin / tu-berlin.de). The
  software behind several of these endpoints is a third party's (DSpace, Moodle, GitLab,
  Synapse); the DEPLOYMENT is TU Berlin's, and that is what is recorded. Standards the
  Kin Score `education` regime names but which could NOT be confirmed are listed with
  conforms:false and the probe that failed to find them — they are recorded so the absence
  is legible, never to claim credit.
  This file was generated by API Evangelist from live probes on 2026-08-30; TU Berlin did
  not publish it and does not publish any conformance statement of its own.
standards:
- id: oai-pmh
  conforms: true
  evidence: >-
    https://api-depositonce.tu-berlin.de/server/oai/request?verb=Identify returns 200
    text/xml with a valid OAI-PMH 2.0 Identify response — repositoryName "DepositOnce",
    protocolVersion 2.0, granularity YYYY-MM-DDThh:mm:ssZ, earliestDatestamp
    1999-01-18T12:00:00Z, adminEmail webmaster@depositonce.tu-berlin.de,
    repositoryIdentifier depositonce.tu-berlin.de. ListMetadataFormats (200) advertises 15
    prefixes — oai_dc, qdc, dim, mods, mets, didl, ore, rdf, marc, etdms, rioxx,
    uketd_dc, xoai, oai_dc_unpaywall. ListRecords and ListSets both return records.
- id: saml
  conforms: true
  evidence: >-
    https://shibboleth.tu-berlin.de/idp/shibboleth returns 200 application/xml, 15,920
    bytes of SAML 2.0 metadata — EntityDescriptor entityID
    https://ephraim.tu-berlin.de/shibboleth with an IDPSSODescriptor and an
    AttributeAuthorityDescriptor. SingleSignOnService bindings HTTP-Redirect, HTTP-POST,
    HTTP-POST-SimpleSign and Shibboleth AuthnRequest at
    https://shibboleth.tubit.tu-berlin.de/idp/profile/...; SingleLogoutService and
    SOAP AttributeQuery / ArtifactResolution on port 8443.
- id: shibboleth
  conforms: true
  evidence: >-
    The metadata above is a Shibboleth IdP (shibmd:Scope regexp="false" tu-berlin.de,
    SAML1 and SAML2 profile endpoints under /idp/profile/). TU Berlin documents Shibboleth
    SSO as the institutional login at
    https://www.tu.berlin/campusmanagement/angebot/shibboleth (200) and is a DFN-AAI
    federation member under this entityID.
- id: lti
  conforms: true
  evidence: >-
    ISIS, the TU Berlin Moodle at isis.tu-berlin.de, serves an LTI 1.3 platform keyset:
    https://isis.tu-berlin.de/mod/lti/certs.php returns 200 application/json with a JWKS
    ({"keys":[{"kty":"RSA","alg":"RS256","kid":"7f4987230101b3fd0200","use":"sig",...}]}),
    and https://isis.tu-berlin.de/mod/lti/auth.php returns 200. The LTI token endpoint
    https://isis.tu-berlin.de/mod/lti/token.php answers 400 to an empty GET, which is the
    expected response for a POST-only OAuth2 client-credentials endpoint.
- id: datacite
  conforms: true
  evidence: >-
    DepositOnce mints DataCite DOIs under prefix 10.14279 — DOIs such as
    10.14279/depositonce-12722 appear in live OAI-PMH ListRecords output. The DataCite
    public API confirms the prefix is real and assigned:
    https://api.datacite.org/prefixes/10.14279 returns 200 with client "tib.tub"
    (TIB / TU Berlin) and provider "jjfy", created 2013-08-22.
- id: orcid
  conforms: false
  evidence: >-
    The DepositOnce DSpace instance registers the field person.identifier.orcid
    (https://api-depositonce.tu-berlin.de/server/api/core/metadatafields/search/byFieldName?schema=person
    returns 200 listing it), but that is DSpace's stock person schema, not evidence of use.
    No ORCID identifier was found in any record returned by ListRecords with metadataPrefix
    xoai or oai_dc, and no ORCID public API integration is advertised. Recorded as not
    confirmed rather than claimed.
- id: crossref
  conforms: false
  evidence: >-
    DepositOnce DOIs resolve through DataCite (prefix 10.14279, client tib.tub); no
    Crossref member prefix or Crossref deposit surface was found on any tu.berlin or
    tu-berlin.de host.
- id: scim
  conforms: false
  evidence: >-
    No /scim/v2 or ServiceProviderConfig endpoint responds on any probed TU Berlin host;
    account provisioning is documented as internal (ZECM / tubIT accounts), not as a
    public SCIM surface.
- id: oneroster
  conforms: false
  evidence: >-
    No IMS OneRoster endpoint found. Course data lives in Moses
    (moseskonto.tu-berlin.de), which serves HTML only — the public Vorlesungsverzeichnis
    at /moses/verzeichnis/index.html returns 200 text/html with no JSON or CSV surface.
- id: caliper
  conforms: false
  evidence: No Caliper Analytics event store or endpoint advertised by ISIS (Moodle) or any TU Berlin host.
- id: qti
  conforms: false
  evidence: No QTI import/export or assessment API is exposed publicly by ISIS or Moses.
- id: ed-fi
  conforms: false
  evidence: Ed-Fi is a US K-12/state-longitudinal standard; no Ed-Fi ODS or API is present, and none is expected for a German university.

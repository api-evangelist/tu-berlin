reviews:
  - date: '2026-08-30'
    rating: 3
    summary: >-
      University-pipeline re-profile. Operator attribution was settled before anything was
      saved: seven surfaces are institution-operated (hosts under tu.berlin / tu-berlin.de)
      and one — library discovery on Ex Libris Primo — is a tenant relationship, recorded
      as such. No vendor contract is saved under this slug and no OpenAPI is derived: TU
      Berlin authors none, and the generic specifications of the products it deploys
      (DSpace, GitLab, Synapse, Moodle) belong to those vendors' own profiles. Three new
      institution-operated surfaces were found that the June 2026 review missed: a public
      Shibboleth SAML 2.0 IdP metadata document (entityID
      https://ephraim.tu-berlin.de/shibboleth, DFN-AAI, scope tu-berlin.de), a Matrix
      homeserver running Synapse 1.157.2 with the Client-Server API answering
      unauthenticated, and ISIS (Moodle) acting as an LTI 1.3 platform with a public RS256
      JWKS. Two June facts were WRONG and are corrected: the GitLab API is not fully gated
      (GET /api/v4/projects returns 200 with X-Total 2851 unauthenticated; only
      /version, /metadata and /mcp are 401), and DepositOnce runs DSpace 9.4, not 8.1.
      Education-regime domain standards confirmed live: oai-pmh, saml, shibboleth, lti,
      datacite (DOI prefix 10.14279, DataCite client tib.tub). orcid, crossref, scim,
      oneroster, caliper, qti and ed-fi were probed and NOT found — recorded as absent
      rather than claimed. No llms.txt (404) and no security.txt (403).
    endpoints:

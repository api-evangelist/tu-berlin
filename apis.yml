  detail: >-
    Every surface below was probed live and unauthenticated on 2026-08-30 from hosts under
    TU Berlin's own registrable domains (tu.berlin, tu-berlin.de), and the profile is thin
    by fact rather than by gap. TU Berlin authors no API contract: there is no OpenAPI,
    AsyncAPI, apis.json, llms.txt (404 on www.tu.berlin) or security.txt (403), and no
    developer portal exists to hold one. What it does operate is a set of standards-based
    deployments of other people's software — DSpace 9, Shibboleth, GitLab, Synapse, Moodle
    — so no openapi/ artifact is saved here: those products' generic specifications belong
    to their vendors' own profiles, and saving one under this slug is exactly the
    misattribution this pipeline exists to prevent. Two facts the June 2026 profile got
    wrong are corrected: the GitLab API is NOT fully gated (public project and group
    listings return 200 unauthenticated, 2,851 public projects) and DepositOnce now runs
    DSpace 9.4, not 8.1. Library discovery was found to be an Ex Libris Primo tenant and
    is recorded as tenant, not as TU Berlin's own.

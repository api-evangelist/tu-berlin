  - aid: tu-berlin:matrix
    name: TU Berlin Matrix Homeserver (Client-Server API)
    x-operator: institution
    description: >-
      TU Berlin runs its own Matrix homeserver for institutional messaging, with an Element
      web client at chat.tu-berlin.de and documentation at docs.chat.tu-berlin.de. The
      Client-Server API answers unauthenticated where the specification says it should:
      /_matrix/client/versions returns 200 advertising r0.0.1 through v1.12,
      /_matrix/federation/v1/version reports Synapse 1.157.2, /.well-known/matrix/client
      returns the homeserver base URL and a Jitsi domain at meet.innocampus.tu-berlin.de,
      and /_matrix/client/v3/login lists m.login.password and m.login.application_service.
      Guest access is disabled. A genuine campus-life API surface, institution-operated,
      speaking an open standard.
    humanURL: https://docs.chat.tu-berlin.de/
    baseURL: https://matrix.tu-berlin.de/_matrix/client
    tags: [ Messaging, Matrix, Synapse, Campus Life, Federation ]
    properties:
      - type: Documentation
        url: https://docs.chat.tu-berlin.de/
      - type: Authentication
        url: authentication/tu-berlin-authentication.yml
  - aid: tu-berlin:isis-lti
    name: ISIS (Moodle) LTI 1.3 Platform
    x-operator: institution
    description: >-
      ISIS is TU Berlin's central learning-management system, a Moodle instance on a TU
      Berlin host. It acts as an LTI 1.3 platform: a public RS256 JWKS is served at
      /mod/lti/certs.php (200, application/json), the OIDC launch endpoint /mod/lti/auth.php
      returns 200, and /mod/lti/token.php is a POST-only client-credentials token endpoint.
      The Moodle web-service API exists but is closed — /webservice/rest/server.php returns
      an invalidtoken exception and tokens are issued only to TU Berlin accounts. LTI is a
      named standard of the Kin Score education regime and this is a live conformance hit.
    humanURL: https://isis.tu-berlin.de/
    baseURL: https://isis.tu-berlin.de/mod/lti
    tags: [ Learning Management, Moodle, LTI, Education, Interoperability ]
    properties:
      - type: Conformance
        url: conformance/tu-berlin-conformance.yml
      - type: Authentication
        url: authentication/tu-berlin-authentication.yml
  - aid: tu-berlin:tubcloud
    name: tubCloud (Nextcloud) API
    x-operator: institution
    description: >-
      tubCloud is TU Berlin's self-hosted Nextcloud file service, operated by the ZECM on a
      TU Berlin host. Only the capability probe is public: /status.php returns 200 with
      Nextcloud 32.0.9 Enterprise. The programmable surface — WebDAV, OCS and the Nextcloud
      REST APIs — requires a TU Berlin account, so it is recorded as a real but fully gated
      institutional surface rather than a public API.
    humanURL: https://www.tu.berlin/campusmanagement
    baseURL: https://tubcloud.tu-berlin.de
    tags: [ File Storage, Nextcloud, WebDAV, Gated, Campus IT ]
    properties:
      - type: Documentation
        url: https://www.tu.berlin/campusmanagement
  - aid: tu-berlin:library-primo
    name: University Library Discovery (Ex Libris Primo)
    x-operator: tenant
    description: >-
      The University Library's discovery layer runs on Ex Libris Primo at
      tu-berlin.hosted.exlibrisgroup.com — an institution-specific tenant on a vendor
      platform, reached from the library pages at www.tu.berlin/ub. The holdings, the view
      configuration and the patron relationship are TU Berlin's; the API and the contract
      are Ex Libris'. Recorded as a tenant relationship so the institution is credited with
      operating a discovery service without being credited with Ex Libris' engineering. No
      Ex Libris specification is saved under this slug.
    humanURL: https://www.tu.berlin/en/wm/bibliothek
    baseURL: https://tu-berlin.hosted.exlibrisgroup.com/primo-explore
    tags: [ Library, Discovery, Primo, Ex Libris, Tenant ]
    properties:
      - type: Documentation
        url: https://www.tu.berlin/en/wm/bibliothek

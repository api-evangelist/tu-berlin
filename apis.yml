apis:
  - aid: tu-berlin:depositonce-oai
    name: DepositOnce OAI-PMH Interface
    x-operator: institution
    description: >-
      Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH 2.0) endpoint for
      DepositOnce, TU Berlin's institutional repository for publications and research data,
      operated by the University Library on a TU Berlin host. Identify returns
      repositoryName "DepositOnce", granularity YYYY-MM-DDThh:mm:ssZ and earliest
      datestamp 1999-01-18. ListMetadataFormats advertises 15 prefixes (oai_dc, qdc, dim,
      mods, mets, didl, ore, rdf, marc, etdms, rioxx, uketd_dc, xoai, oai_dc_unpaywall).
      Records carry DataCite DOIs under the 10.14279 prefix. Fully open — no credential.
      The protocol is OAI's and the software is DSpace's; the deployment and the metadata
      are TU Berlin's.
    humanURL: https://depositonce.tu-berlin.de/info/help
    baseURL: https://api-depositonce.tu-berlin.de/server/oai/request
    tags: [ Research Data, Open Access, Repository, OAI-PMH, DSpace, Metadata ]
    properties:
      - type: Documentation
        url: https://depositonce.tu-berlin.de/info/help
      - type: Conformance
        url: conformance/tu-berlin-conformance.yml
  - aid: tu-berlin:depositonce-rest
    name: DepositOnce DSpace REST API
    x-operator: institution
    description: >-
      DSpace 9.4 REST/HAL API for DepositOnce, exposing communities, collections, items,
      bitstreams, discovery, versioning, COAR Notify (ldnservices) and usage reports.
      Anonymous access is genuinely partial and worth stating: the API root and
      /discover/search/objects return 200 without a credential, while /core/items returns
      401. An OpenSearch 1.1 description is served at /server/opensearch/service with atom
      and rss result templates. No OpenAPI is published by TU Berlin for this surface, and
      DSpace's own generic specification is deliberately not saved under this institution.
    humanURL: https://depositonce.tu-berlin.de/info/help
    baseURL: https://api-depositonce.tu-berlin.de/server/api
    tags: [ Research Data, Open Access, Repository, REST, DSpace, HAL, OpenSearch ]
    properties:
      - type: Documentation
        url: https://depositonce.tu-berlin.de/info/help
      - type: OpenSearch
        url: https://api-depositonce.tu-berlin.de/server/opensearch/service
      - type: Authentication
        url: authentication/tu-berlin-authentication.yml
  - aid: tu-berlin:shibboleth-idp
    name: TU Berlin Shibboleth Identity Provider (SAML 2.0 Metadata)
    x-operator: institution
    description: >-
      The institution's own Shibboleth Identity Provider, operated by the ZECM and
      registered in the DFN-AAI federation. Its SAML 2.0 metadata is public and
      machine-readable — 15,920 bytes of XML declaring entityID
      https://ephraim.tu-berlin.de/shibboleth, an IDPSSODescriptor with HTTP-Redirect,
      HTTP-POST, POST-SimpleSign and Shibboleth AuthnRequest SSO bindings, SOAP logout and
      an AttributeAuthorityDescriptor with SAML1/SAML2 AttributeQuery, all scoped to
      tu-berlin.de. This is the one machine-readable surface a university operates by
      definition, and it is entirely TU Berlin's.
    humanURL: https://www.tu.berlin/campusmanagement/angebot/shibboleth
    baseURL: https://shibboleth.tu-berlin.de/idp/shibboleth
    tags: [ Identity Federation, SAML, Shibboleth, DFN-AAI, Single Sign-On, Authentication ]
    properties:
      - type: Documentation
        url: https://www.tu.berlin/campusmanagement/angebot/shibboleth
      - type: Authentication
        url: authentication/tu-berlin-authentication.yml
  - aid: tu-berlin:gitlab
    name: TU Berlin GitLab API
    x-operator: institution
    description: >-
      Self-hosted GitLab Enterprise Edition for TU Berlin. Correcting the June 2026
      profile, which recorded this API as fully gated: unauthenticated reads of public
      resources succeed — GET /api/v4/projects returns 200 with X-Total 2851 and
      /api/v4/groups returns 200 — while /api/v4/version, /api/v4/metadata and
      /api/v4/mcp return 401. The instance is also its own OAuth 2.0 / OIDC provider:
      /.well-known/openid-configuration returns 200 with PKCE S256 and 26 scopes,
      including GitLab's mcp and ai_features scopes. Human login is brokered through
      Shibboleth SSO. The API contract is GitLab's product contract; the deployment,
      the projects and the token policy are TU Berlin's.
    humanURL: https://git.tu-berlin.de/explore/projects
    baseURL: https://git.tu-berlin.de/api/v4
    tags:
    - Source Code
    - GitLab
    - Git
    - Authentication
    - OpenID Connect
    tags_raw:
    - Source Code
    - GitLab
    - Git
    - OAuth
    - OpenID Connect
    - Authentication
    properties:
      - type: Documentation
        url: https://www.tu.berlin/en/campusmanagement/news-details/gitlab-anmeldung-mit-shibboleth-single-sign-on
      - type: WellKnown

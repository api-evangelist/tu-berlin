aid: tu-berlin
name: Technical University of Berlin
x-type: university
x-category: Technical University
description: >-
  Technische Universität Berlin (TU Berlin) is a public technical research university in
  Berlin, Germany, and a member of the Berlin University Alliance and the TU9 alliance of
  German institutes of technology. It operates no central developer portal, publishes no
  OpenAPI, AsyncAPI or apis.json of its own, and sells no API product — its programmable
  footprint is the set of standards-based endpoints its own IT units expose on its own
  hosts, running third-party software. Confirmed live and unauthenticated: the DepositOnce
  institutional repository (DSpace 9, OAI-PMH with 15 metadata formats, a REST/HAL API and
  an OpenSearch description, minting DataCite DOIs under prefix 10.14279); a Shibboleth
  SAML 2.0 Identity Provider whose federation metadata is public (entityID
  https://ephraim.tu-berlin.de/shibboleth, DFN-AAI); a self-hosted GitLab whose REST v4
  lists 2,851 public projects without credentials and which is its own OAuth2/OIDC
  provider; a Matrix homeserver (Synapse) with the Client-Server API answering openly; and
  ISIS, the institutional Moodle, acting as an LTI 1.3 platform with a public keyset.
  Library discovery is an Ex Libris Primo tenant, not TU Berlin engineering. Nothing here
  is an institution-authored contract, and none is claimed.
